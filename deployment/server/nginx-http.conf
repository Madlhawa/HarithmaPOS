# Harithma POS over plain HTTP. Used only until the HTTPS certificate exists
# (deploy.sh then switches to nginx-https.conf), or on a server with no domain.

# Sign-in and password-reset form posts: 10 a minute per address, short bursts allowed.
map $request_method $harithma_login_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $harithma_login_key zone=harithma_login:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/app/(login|reset_password)(/|$) {
        limit_req zone=harithma_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 /429.html;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /429.html {
        internal;
        root /var/www/harithma;
    }

    location /static {
        alias /opt/harithma-pos/harithmapos/static;
        expires 30d;
        add_header Cache-Control "public";
    }
}
