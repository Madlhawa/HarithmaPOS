# SSH hardening for Harithma POS. Installed as /etc/ssh/sshd_config.d/10-harithma.conf
# (the first value sshd reads wins, so this file sorts before the cloud image's).
# Keys only: passwords are never accepted, for root or anyone else.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
# Fewer guesses per connection and less time to finish logging in.
MaxAuthTries 4
LoginGraceTime 30
# No graphical forwarding (nothing here needs it).
X11Forwarding no
