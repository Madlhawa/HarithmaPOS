{% extends 'layout/base.html' %}
{% from 'layout/macros.html' import flashes, brand_lockup %}
{% block shell %}
<div class="auth">
    <div class="auth-brand">
        {{ brand_lockup('brand-lockup-lg') }}
        <div>
            <h1>Harithma Service Center</h1>
            <p>Services, stock and payments for the station, in one place.</p>
        </div>
    </div>
    <main class="auth-form" id="main">
        <div class="auth-card">
            {{ flashes() }}
            {% block auth %}{% endblock %}
        </div>
    </main>
</div>
{% endblock %}
